<template>
    <div class="slds-box slds-theme_default slds-m-bottom_medium">
        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_small">
            <h2 class="slds-text-heading_small">Configuration</h2>
            <lightning-button label="Revérifier" onclick={handleRecheck} disabled={loading} data-id="recheck"></lightning-button>
        </div>
        <ul class="slds-has-dividers_bottom-space">
            <template for:each={items} for:item="c">
                <li key={c.code} class="slds-item" data-id="check">
                    <div class="slds-grid slds-grid_vertical-align-center">
                        <lightning-icon icon-name={c.icon} size="x-small" class="slds-m-right_x-small"></lightning-icon>
                        <span>{c.label}</span>
                    </div>
                    <template lwc:if={c.action}>
                        <p class="slds-text-color_error slds-m-left_large slds-m-top_xx-small" data-id="action">{c.action}</p>
                    </template>
                </li>
            </template>
        </ul>
    </div>
</template>
