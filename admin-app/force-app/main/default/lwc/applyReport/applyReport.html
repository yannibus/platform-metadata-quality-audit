<template>
    <template lwc:if={report}>
        <div class="slds-box slds-theme_default slds-m-top_medium" data-id="report">
            <h2 class="slds-text-heading_small slds-m-bottom_small">Résultat de l'application</h2>
            <p class="slds-m-bottom_small" data-id="summary">
                <strong>{report.applied}</strong> appliqué(s) · <strong>{report.skipped}</strong> ignoré(s) · <strong>{report.failed}</strong> en échec
            </p>
            <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                <thead>
                    <tr class="slds-line-height_reset">
                        <th scope="col">Champ</th><th scope="col">Attribut</th><th scope="col">Résultat</th><th scope="col">Relecture</th><th scope="col">Détail</th>
                    </tr>
                </thead>
                <tbody>
                    <template for:each={viewRows} for:item="r">
                        <tr key={r.id} data-id="result-row">
                            <td>{r.field}</td>
                            <td>{r.attributeLabel}</td>
                            <td><span class={r.badgeClass}>{r.statusLabel}</span></td>
                            <td>{r.verifiedLabel}</td>
                            <td class="slds-cell-wrap">{r.message}</td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </template>
</template>
